                                            <ScatterChart margin={{ top: 20, right: 20, bottom: 20, left: 20 }}>
                                                <CartesianGrid strokeDasharray="3 3" opacity={0.2} />
                                                <XAxis type="number" dataKey="x" name="آنتروپی فرمی" unit="%" />
                                                <YAxis type="number" dataKey="y" name="اضطرابِ ادراکی" unit="%" />
                                                <ZAxis type="number" dataKey="z" range={[100, 1000]} /><Tooltip cursor={{ strokeDasharray: '3 3' }} />
                                                <Scatter name="حوزه‌های فرهنگی" data={complexityAnxiety} fill="#bc6c25">
                                                    {complexityAnxiety.map((e, i) => <Cell key={i} fill={i % 2 === 0 ? '#bc6c25' : '#606c38'} />)}
                                                </Scatter>
                                            </ScatterChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <p className="mt-8 text-sm text-slate-600 text-justify leading-8 font-light">این تحلیل، رابطه‌ی مستقیمِ میان «دقتِ افراطی» و «ترومایِ زمانی» را آشکار می‌کند. نظم صلب برابر است با استرس بالا.</p>
                                </div>
                            </div>
                        </section>

                        {/* Section 2: Summary */}
                        <section>
                            <div className="bg-white p-12 md:p-24 rounded-[5rem] border border-[#283618]/10 shadow-2xl relative overflow-hidden text-justify text-xl leading-10 text-[#283618]/90 font-light">
                                <div className="absolute top-0 left-0 w-4 h-full bg-[#bc6c25]"></div>
                                <div className="flex items-center mb-16">
                                    <div className="p-6 bg-[#283618] rounded-[2.5rem] text-white ml-8 shadow-2xl flex items-center justify-center"><i data-lucide="microscope" size={48}></i></div>
                                    <h2 className="text-4xl md:text-6xl font-bold text-[#283618]">استنتاجِ فنومنولوژیک و تحلیلِ فراداده</h2>
                                </div>
                                <p>واکاویِ ۶۱ نقشه‌ی ذهنی نشان می‌دهد که اضطرابِ زمانی، محصولِ دقتِ کاذب در دیوایس‌های مدرن است. ما با جایگزینیِ ثانیه‌های صلب با تغییراتِ اتمسفریک، می‌توانیم از مدلِ «زمانِ ساعت» به مدلِ «زمانِ زندگی» مهاجرت کنیم.</p>
                            </div>
                        </section>

                        {/* Section 3: Protocol */}
                        <section id="roadmap" className="space-y-32">
                            <h2 className="text-4xl font-bold text-[#283618] section-title flex items-center">
                                <i data-lucide="shield-check" className="ml-4 text-[#bc6c25]" size={40}></i> لایه دوم: منشور طراحیِ ساعتِ ضدِ-اضطراب
                            </h2>
                            <div className="grid grid-cols-1 gap-12">
                                <div className="protocol-card shadow-xl font-light">
                                    <h4 className="text-[#bc6c25] font-bold text-3xl mb-4">فاز اول: انهدامِ استبدادِ کرونومتریک</h4>
                                    <p className="text-lg leading-10 text-slate-600 text-justify">حذفِ واحدِ ثانیه یک الزامِ بیولوژیک است. نمایش ثانیه باعثِ تحریکِ سیستمِ لیمبیک و القایِ حسِ شکار شدن می‌شود. راهکار نهایی، استفاده از Subtractive UI است.</p>
                                </div>
                                <div className="protocol-card shadow-xl font-light">
                                    <h4 className="text-[#606c38] font-bold text-3xl mb-4">فاز دوم: مهندسیِ لمسی (Haptic Bio-Sync)</h4>
                                    <p className="text-lg leading-10 text-slate-600 text-justify">ساعت باید بخشی از کالبدِ بیولوژیک فرد باشد. استفاده از متریال‌هایی با ضریبِ انتقالِ حرارت مشابه پوست تضادِ بدن و ماشین را از بین می‌برد.</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 mt-24">
                                <div className="bg-emerald-50/50 p-16 rounded-[5rem] border border-emerald-100 relative shadow-inner">
                                    <div className="absolute -top-8 right-16 bg-emerald-600 text-white px-12 py-5 rounded-full font-bold shadow-2xl flex items-center text-xl"><i data-lucide="check-circle" className="ml-3"></i> بایدها</div>
                                    <div className="grid grid-cols-1 gap-12 mt-12">
                                        <p className="text-sm font-bold text-emerald-900 leading-7">۱. نمایشگرِ طیفی: نمایش زمان از طریقِ تغییرِ فام جهتِ حذفِ مرزهای صلبِ لحظه.</p>
                                        <p className="text-sm font-bold text-emerald-900 leading-7">۲. حرکتِ پیوسته: استفاده از موتورهای بدون پله برای القایِ حسِ جریانِ ابدی.</p>
                                        <p className="text-sm font-bold text-emerald-900 leading-7">۳. بافت‌هایِ آنتروپومورفیک: به کارگیری موادی مثل چوب یا سرامیک مات.</p>
                                    </div>
                                </div>
                                <div className="bg-rose-50/50 p-16 rounded-[5rem] border border-rose-100 relative shadow-inner">
                                    <div className="absolute -top-8 right-16 bg-rose-600 text-white px-12 py-5 rounded-full font-bold shadow-2xl flex items-center text-xl"><i data-lucide="x-circle" className="ml-3"></i> نبایدها</div>
                                    <div className="grid grid-cols-1 gap-12 mt-12">
                                        <p className="text-sm font-bold text-rose-900 leading-7">۱. اعدادِ صلبِ دیجیتال: هرگونه نشانه‌ی ریاضیاتی که ذهن را به محاسبات وا می‌دارد.</p>
                                        <p className="text-sm font-bold text-rose-900 leading-7">۲. ثانیه‌شمارِ تیز: نمادِ بریدنِ بی‌رحمانه‌یِ لحظات و ایجادِ تروما.</p>
                                        <p className="text-sm font-bold text-rose-900 leading-7">۳. لرزش‌هایِ هشداردهنده: نوتیفیکیشن‌های تهاجمی که تمرکز بر حضور را مختل می‌کنند.</p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Section 4: Full Gallery Ref */}
                        <section id="gallery">
                            <h2 className="text-4xl font-bold text-[#283618] section-title flex items-center mb-20">
                                <i data-lucide="layout-grid" className="ml-4 text-[#bc6c25]" size={36}></i> مرجع بصری: ۶۱ داده‌یِ خام (GitHub Live)
                            </h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
                                {SKETCH_DATA.map((s) => (
                                    <div key={s.id} className="sketch-card group cursor-help shadow-sm">
                                        <div className="aspect-square rounded-[1.8rem] mb-4 overflow-hidden bg-slate-100 relative shadow-inner border border-slate-50">
                                            <img 
                                                src={!s.uni ? `${GITHUB_BASE}/${encodeURIComponent(s.file)}` : `${GITHUB_BASE}/${s.uni}/${encodeURIComponent(s.culture)}/${encodeURIComponent(s.file)}`} 
                                                alt={s.title} 
                                                className="w-full h-full object-cover grayscale opacity-60 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-700"
                                                onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }}
                                            />
                                            <div className="hidden absolute inset-0 items-center justify-center text-[#283618]/20 flex-col p-2 text-center bg-slate-50">
                                                <i data-lucide="image-off" size={24} className="mb-2 opacity-50"></i>
                                                <span className="text-[7px] leading-tight font-bold opacity-30">{s.file}</span>
                                            </div>
                                            <div className="absolute top-2 right-2 bg-white/70 px-2 rounded-lg text-[9px] font-bold shadow-sm">#{s.id}</div>
                                        </div>
                                        <h4 className="text-[10px] font-bold text-[#283618] truncate px-1 font-bold">{s.title}</h4>
                                        <div className="flex justify-between items-center text-[8px] px-1 mt-2 opacity-50 font-bold uppercase tracking-tighter">
                                            <span className="truncate max-w-[50px]">{s.culture}</span>
                                            <span>{s.uni}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </div>

                    <footer className="mt-56 mb-24 text-center border-t border-[#283618]/10 pt-24 opacity-30">
                        <p className="text-[11px] font-bold tracking-[0.6em] text-[#bc6c25] uppercase">Scientific Cynicism & Temporal Architecture - Thesis Portfolio - 2026</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
