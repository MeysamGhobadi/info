                                </div>
                                <div className="chart-container lg:col-span-2">
                                    <h3 className="text-sm font-bold mb-6 border-b pb-3 uppercase tracking-widest text-slate-500">۴. آنتروپی بصری vs شاخص اضطراب</h3>
                                    <div className="h-[450px]">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <ScatterChart margin={{ top: 20, right: 20, bottom: 20, left: 20 }}>
                                                <CartesianGrid strokeDasharray="3 3" opacity={0.2} />
                                                <XAxis type="number" dataKey="x" name="Complexity" unit="%" />
                                                <YAxis type="number" dataKey="y" name="Anxiety" unit="%" />
                                                <ZAxis type="number" dataKey="z" range={[100, 1000]} /><Tooltip cursor={{ strokeDasharray: '3 3' }} />
                                                <Scatter name="Cultures" data={complexityAnxiety} fill="#bc6c25">
                                                    {complexityAnxiety.map((e, i) => <Cell key={i} fill={i % 2 === 0 ? '#bc6c25' : '#606c38'} />)}
                                                </Scatter>
                                            </ScatterChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <p className="mt-8 text-sm text-slate-600 text-justify leading-8 font-light">این تحلیلِ نقطه‌ای، رابطه‌ی مستقیمِ میان «نظمِ تحمیلی» و «اضطراب» را آشکار می‌کند. هرچه هندسه صلب‌تر شده، شاخصِ اضطراب به ۹۵٪ نزدیک‌تر شده است.</p>
                                </div>
                            </div>
                        </section>

                        {/* Section 2: Summary */}
                        <section>
                            <div className="bg-white p-12 md:p-24 rounded-[5rem] border border-[#283618]/10 shadow-2xl relative overflow-hidden text-justify text-xl leading-10 text-[#283618]/90 font-light">
                                <div className="absolute top-0 left-0 w-4 h-full bg-[#bc6c25]"></div>
                                <div className="flex items-center mb-16">
                                    <div className="p-6 bg-[#283618] rounded-[2.5rem] text-white ml-8 shadow-2xl flex items-center justify-center"><i data-lucide="microscope" size={48}></i></div>
                                    <h2 className="text-4xl md:text-6xl font-bold text-[#283618]">استنتاجِ فنومنولوژیک و تحلیلِ فراداده</h2>
                                </div>
                                <p>بر اساس تحلیلِ چندبُعدیِ ۶۱ اسکیس، ما با یک «پارادوکسِ کرونومتریک» مواجه هستیم. داده‌ها نشان می‌دهد که در غرب، زمان به یک «ماشینِ سرکوبگر» تبدیل شده است. استراتژی «محو کردنِ مرزهای لحظه»، با الهام از «دریم‌تایم» بومیان، به کاربر اجازه می‌دهد تا به جای تماشایِ پایان یافتنِ دقایق، در جریانِ «شدن» غوطه‌ور شود.</p>
                            </div>
                        </section>

                        {/* Section 3: Protocol */}
                        <section id="roadmap" className="space-y-32">
                            <h2 className="text-4xl font-bold text-[#283618] section-title flex items-center">
                                <i data-lucide="shield-check" className="ml-4 text-[#bc6c25]" size={40}></i> لایه دوم: منشور طراحیِ ساعتِ ضدِ-اضطراب (Design Protocol)
                            </h2>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 mt-24">
                                <div className="bg-emerald-50/50 p-16 rounded-[5rem] border border-emerald-100 relative shadow-inner">
                                    <div className="absolute -top-8 right-16 bg-emerald-600 text-white px-12 py-5 rounded-full font-bold shadow-2xl flex items-center text-xl"><i data-lucide="check-circle" className="ml-3"></i> بایدها (Mandatory Protocol)</div>
                                    <div className="grid grid-cols-1 gap-12 mt-12">
                                        {[
                                            { t: "نمایشگرِ طیفی (Gradient):", d: "نمایش زمان از طریق تغییر رنگِ صفحه برای حذفِ مرزهای صلبِ ثانیه." },
                                            { t: "حرکتِ پیوسته (Sweep Flow):", d: "استفاده از موتورهای بدونِ پله برای القایِ حسِ جریانِ ابدی." },
                                            { t: "بافتِ آنتروپومورفیک:", d: "به کارگیریِ موادی مثل چوب یا سرامیکِ مات برای بازسازیِ حسِ لمسیِ زمین." }
                                        ].map((item, i) => (
                                            <div key={i} className="flex gap-8"><div className="w-12 h-12 bg-emerald-100 rounded-3xl flex items-center justify-center text-emerald-600 font-bold text-2xl shrink-0 shadow-sm">{i+1}</div><div><h4 className="font-bold text-emerald-900 text-2xl">{item.t}</h4><p className="text-sm text-emerald-800/80 mt-2 leading-7">{item.d}</p></div></div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-rose-50/50 p-16 rounded-[5rem] border border-rose-100 relative shadow-inner">
                                    <div className="absolute -top-8 right-16 bg-rose-600 text-white px-12 py-5 rounded-full font-bold shadow-2xl flex items-center text-xl"><i data-lucide="x-circle" className="ml-3"></i> نبایدها (System Inhibitions)</div>
                                    <div className="grid grid-cols-1 gap-12 mt-12">
                                        {[
                                            { t: "اعدادِ صلبِ دیجیتال:", d: "هرگونه نشانه‌ی ریاضیاتی که ذهن را به سمتِ وسواسِ بهره‌وری می‌برد." },
                                            { t: "ثانیه‌شمارِ تیز:", d: "عقربه‌های نوک‌تیز که نمادِ «بریدنِ» بی‌رحمانه‌یِ لحظات و ایجادِ تروما هستند." },
                                            { t: "لرزش‌هایِ هشداردهنده:", d: "نوتیفیکیشن‌های تهاجمی که تمرکز بر «حضور» را مختل می‌کنند." }
                                        ].map((item, i) => (
                                            <div key={i} className="flex gap-8"><div className="w-12 h-12 bg-rose-100 rounded-3xl flex items-center justify-center text-rose-600 font-bold text-2xl shrink-0 shadow-sm">{i+1}</div><div><h4 className="font-bold text-rose-900 text-2xl">{item.t}</h4><p className="text-sm text-rose-800/80 mt-2 leading-7">{item.d}</p></div></div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Section 4: Full Gallery Ref */}
                        <section id="gallery">
                            <h2 className="text-4xl font-bold text-[#283618] section-title flex items-center mb-20">
                                <i data-lucide="layout-grid" className="ml-4 text-[#bc6c25]" size={36}></i> مرجع بصری: ۶۱ داده‌یِ خام (GitHub Live)
                            </h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
                                {SKETCH_DATA.map((s) => (
                                    <div key={s.id} className="sketch-card group cursor-help shadow-sm">
                                        <div className="aspect-square rounded-[1.8rem] mb-4 overflow-hidden bg-slate-100 relative shadow-inner border border-slate-50">
                                            <img 
                                                src={(s.id === 45 || s.id === 61) ? `${GITHUB_BASE}/${encodeURIComponent(s.file)}` : `${GITHUB_BASE}/${s.uni}/${encodeURIComponent(s.culture)}/${encodeURIComponent(s.file)}`} 
                                                alt={s.title} 
                                                className="w-full h-full object-cover grayscale opacity-60 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-700"
                                                onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }}
                                            />
                                            <div className="hidden absolute inset-0 items-center justify-center text-[#283618]/20 flex-col p-2 text-center bg-slate-50">
                                                <i data-lucide="image-off" size={24} className="mb-2 opacity-50"></i>
                                                <span className="text-[7px] leading-tight font-bold opacity-30">{s.file}</span>
                                            </div>
                                            <div className="absolute top-2 right-2 bg-white/70 px-2 rounded-lg text-[9px] font-bold shadow-sm">#{s.id}</div>
                                        </div>
                                        <h4 className="text-[10px] font-bold text-[#283618] truncate px-1">{s.title}</h4>
                                        <div className="flex justify-between items-center text-[8px] px-1 mt-2 opacity-50 font-bold uppercase tracking-tighter">
                                            <span className="truncate max-w-[50px]">{s.culture}</span>
                                            <span>{s.uni}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </div>

                    <footer className="mt-56 mb-24 text-center border-t border-[#283618]/10 pt-24 opacity-30">
                        <p className="text-[11px] font-bold tracking-[0.6em] text-[#bc6c25] uppercase">Scientific Cynicism & Temporal Architecture - Thesis Portfolio - 2026</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
