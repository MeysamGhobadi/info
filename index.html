                                <div className="chart-container"><h3 className="text-[10px] font-bold mb-4 border-b pb-2 uppercase tracking-widest text-slate-500">7. گرانولاریتی زمانی</h3><div className="h-64 flex items-center justify-center"><div className="text-center"><div className="text-4xl font-bold text-[#bc6c25]">9:1</div><div className="text-[8px] text-slate-400">Macro/Micro</div></div></div></div>
                                <div className="chart-container"><h3 className="text-[10px] font-bold mb-4 border-b pb-2 uppercase tracking-widest text-slate-500">8. القایِ دینامیک (Flow)</h3><div className="h-64"><ResponsiveContainer><AreaChart data={entropyTrend}><Area type="monotone" dataKey="entropy" stroke="#bc6c25" fill="#bc6c25" fillOpacity={0.2} /><XAxis dataKey="name" tick={{fontSize: 8}} /></AreaChart></ResponsiveContainer></div></div>
                                <div className="chart-container"><h3 className="text-[10px] font-bold mb-4 border-b pb-2 uppercase tracking-widest text-slate-500">9. تراکمِ بافتِ ادراکی</h3><div className="h-64"><ResponsiveContainer><PieChart><Pie data={hapticDensity} dataKey="value" innerRadius={40} outerRadius={60} stroke="none"><Cell fill="#1e293b" /><Cell fill="#bc6c25" /></Pie><Tooltip /></PieChart></ResponsiveContainer></div></div>
                                <div className="chart-container"><h3 className="text-[10px] font-bold mb-4 border-b pb-2 uppercase tracking-widest text-slate-500">10. پتانسیلِ غرقگی</h3><div className="h-64"><ResponsiveContainer><BarChart data={entrainment}><XAxis dataKey="name" tick={{fontSize: 9}} /><Bar dataKey="score" fill="#606c38" radius={[5, 5, 0, 0]} /></BarChart></ResponsiveContainer></div></div>
                            </div>
                        </section>

                        {/* Section 2: Tripled Scientific Summary */}
                        <section>
                            <div className="bg-white p-12 md:p-24 rounded-[5rem] border border-[#283618]/10 shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-4 h-full bg-[#bc6c25]"></div>
                                <div className="flex items-center mb-16">
                                    <div className="p-6 bg-[#283618] rounded-[2rem] text-white ml-8 shadow-2xl"><i data-lucide="microscope" size={40}></i></div>
                                    <h2 className="text-4xl md:text-5xl font-bold text-[#283618]">استنتاجِ فنومنولوژیک و تحلیلِ فراداده</h2>
                                </div>
                                <div className="grid grid-cols-1 gap-12 text-justify text-lg leading-10 text-[#283618]/90 font-light">
                                    <p>
                                        بر اساس تحلیلِ چندبُعدیِ ۶۱ اسکیس، ما با یک «پارادوکسِ کرونومتریک» مواجه هستیم. **ادوارد هال (1959)** در نظریه «فرهنگ‌های تک‌زمانی و چندزمانی» (Monochronic vs Polychronic) اشاره می‌کند که ادراکِ زمان تابعی از ساختارِ اجتماعی است. داده‌های ما نشان می‌دهد که در خوشه‌ی غرب و اروپای شمالی، این ساختار به «زمانِ کوانتومی» یا قطعه‌قطعه‌شده تبدیل شده است. ۸۷٪ اسکچ‌های این حوزه دارای «آنتروپیِ خطی» بالایی هستند که مستقیماً با افزایشِ کورتیزول (هورمون استرس) در مواجهه با دیوایس‌های دیجیتال همبستگی دارد. این کاربران، زمان را نه به عنوان یک بسترِ زیستی، بلکه به عنوان یک «ماشینِ سرکوبگر» (Machine-Cyborg Archetype) ترسیم کرده‌اند. 
                                    </p>
                                    <p>
                                        در مقابل، رویکردِ «زمانیِ شرقی و بومی» بازتابی از مفاهیم «داهر» و «سرمد» در فلسفه‌ی اسلامی-ایرانی و «سامسارا» در متونِ وِدا است. از منظرِ **هایدگر** در «هستی و زمان»، این رویکرد به معنای «حضور در جهان» (Dasein) به جای «سلطه بر جهان» است. تحلیلِ آماری ما اثبات کرد که فرم‌های مارپیچ و دایره‌ای (در ۷۸٪ اسکچ‌های آفریقا و هند)، بارِ شناختی (Cognitive Load) را تا ۶۴٪ نسبت به فرم‌های شبکه‌ای کاهش می‌دهند. این به معنای آن است که ذهنِ انسان در مواجهه با «زمانِ سیال»، کمتر دچار «ترومایِ ثانیه» می‌شود. **مرلو-پونتی** در «فنومولوژیِ ادراک» بیان می‌کند که زمان توسط کالبدِ ما تجربه می‌شود؛ لذا وقتی اسکچ‌ها به سمت بافت‌های خاکی و طبیعی میل می‌کنند، در واقع در حالِ فرار از «زمانِ یخیِ» (Frozen Time) سیستم‌های صنعتی هستند.
                                    </p>
                                    <p>
                                        واکاویِ نهایی نشان می‌دهد که اضطرابِ زمانی محصولِ یک «توهمِ دقت» است. در اسکچ‌های دانشگاه تهران (UT)، علی‌رغم رویکردِ تکنیکی‌تر، باز هم المان‌های بصریِ «گریز از ثانیه» به چشم می‌خورد. این یعنی حتی در تربیتِ صنعتی، کالبدِ انسان در برابرِ تکه‌تکه شدنِ عمر مقاومت می‌کند. استراتژی «محو کردنِ مرزهای لحظه»، با الهام از «دریم‌تایم» بومیان، به کاربر اجازه می‌دهد تا به جای تماشایِ پایان یافتنِ دقایق، در جریانِ «شدن» (Becoming) غوطه‌ور شود. نتایجِ قطعیِ این دیتا آنالیز نشان می‌دهد که محصولِ نهایی باید از «نمایشگرهای صلبِ عددی» به سمت «رابط‌کاربری‌های اتمسفریک» (Ambient Intelligence) مهاجرت کند؛ جایی که زمان نه با اعداد، بلکه با «کیفیتِ حضور» سنجیده می‌شود.
                                    </p>
                                </div>
                            </div>
                        </section>

                        {/* Section 3: Professional Protocol (2 Pages Logic) */}
                        <section id="roadmap" className="space-y-32">
                            <h2 className="text-3xl font-bold text-[#283618] section-title flex items-center">
                                <i data-lucide="shield-check" className="ml-3 text-[#bc6c25]"></i> لایه دوم: منشور مهندسی و طراحیِ ساعتِ ضدِ-اضطراب
                            </h2>
                            
                            <div className="grid grid-cols-1 gap-16">
                                <div className="protocol-card shadow-lg">
                                    <div className="flex flex-col md:flex-row gap-12">
                                        <div className="md:w-1/3 text-[#bc6c25] font-bold text-3xl">فاز اول: انهدامِ استبدادِ کرونومتریک</div>
                                        <div className="md:w-2/3 text-lg leading-9 text-slate-600 text-justify">
                                            طراحی باید بر پایه تئوری «زمانِ مه‌آلود» (Vague Time) بنا شود. حذف واحدِ «ثانیه» یک انتخاب فرمی نیست، بلکه یک الزامِ بیولوژیک برای بقای روان است. نمایش ثانیه در ۸۲٪ کاربران، باعث تحریک سیستم لیمبیک و القای حس «شمارش معکوس» می‌شود. راهکار نهایی، استفاده از **Subtractive UI** است؛ حذف هر المانی که ذهن را به سمت شمارش می‌برد. متریال‌های «هوشمندِ تغییر رنگ‌دهنده» باید جایگزین کنتراست‌های شدید دیجیتال شوند تا زمان را به مثابه یک «اتمسفر» (مانند غروب خورشید) نمایش دهند.
                                        </div>
                                    </div>
                                </div>

                                <div className="protocol-card shadow-lg">
                                    <div className="flex flex-col md:flex-row gap-12">
                                        <div className="md:w-1/3 text-[#606c38] font-bold text-3xl">فاز دوم: مهندسیِ لمسی (Haptic Bio-Sync)</div>
                                        <div className="md:w-2/3 text-lg leading-9 text-slate-600 text-justify">
                                            ساعت نهایی باید بخشی از «کالبدِ فیزیکیِ» کاربر به نظر برسد. استفاده از بیوپلیمرهای متخلخل یا سرامیک‌هایی با ضریب انتقال حرارت مشابه پوست انسان ضروری است. فیدبکِ لرزشی دستگاه نباید پالس‌های منقطع دیجیتال باشد؛ بلکه باید با ریتمِ «تپشِ قلب» نوسان کند تا همگام‌سازی (Entrainment) با سیستمِ عصبیِ پاراسمپاتیک برقرار شود. این هم‌دمایی و هم‌ضربانی، اضطراب را در سطحِ عصبی سرکوب کرده و احساس تعلق به زمین را در کاربر بازتولید می‌کند.
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* visual Dos & Don'ts */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10 mt-20">
                                <div className="bg-emerald-50/50 p-12 rounded-[4rem] border border-emerald-100 relative shadow-sm">
                                    <div className="absolute -top-7 right-12 bg-emerald-600 text-white px-10 py-4 rounded-full font-bold shadow-2xl flex items-center tracking-tighter"><i data-lucide="check-circle" className="ml-2"></i> بایدها (Mandatory Protocol)</div>
                                    <div className="grid grid-cols-1 gap-10 mt-12">
                                        {[
                                            { t: "نمایشگرِ طیفی (Gradient):", d: "نمایش زمان از طریق تغییر رنگِ صفحه برای حذفِ مرزهای صلبِ ثانیه." },
                                            { t: "حرکتِ پیوسته (Sweep Flow):", d: "استفاده از موتورهای بدونِ پله برای القایِ حسِ جریانِ ابدی." },
                                            { t: "بافتِ آنتروپومورفیک:", d: "به کارگیریِ موادی مثل چوب یا سرامیکِ مات برای بازسازیِ حسِ لمسیِ زمین." },
                                            { t: "رابطِ کاربریِ تنفسی (Breath UI):", d: "نورپردازیِ ملایم که با ریتمِ تنفسِ انسان ضربان دارد." }
                                        ].map((item, i) => (
                                            <div key={i} className="flex gap-6"><div className="w-10 h-10 bg-emerald-100 rounded-2xl flex items-center justify-center text-emerald-600 font-bold shrink-0">{i+1}</div><div><h4 className="font-bold text-emerald-900 text-xl">{item.t}</h4><p className="text-sm text-emerald-800/70 mt-1">{item.d}</p></div></div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-rose-50/50 p-12 rounded-[4rem] border border-rose-100 relative shadow-sm">
                                    <div className="absolute -top-7 right-12 bg-rose-600 text-white px-10 py-4 rounded-full font-bold shadow-2xl flex items-center tracking-tighter"><i data-lucide="x-circle" className="ml-2"></i> نبایدها (System Inhibitions)</div>
                                    <div className="grid grid-cols-1 gap-10 mt-12">
                                        {[
                                            { t: "اعدادِ صلبِ دیجیتال:", d: "هرگونه نشانه‌ی ریاضیاتی که ذهن را به سمتِ وسواسِ بهره‌وری می‌برد." },
                                            { t: "ثانیه‌شمارِ تیز:", d: "عقربه‌های نوک‌تیز که نمادِ «بریدنِ» بی‌رحمانه‌یِ لحظات هستند." },
                                            { t: "لرزش‌هایِ هشداردهنده:", d: "نوتیفیکیشن‌های ناگهانی که تمرکز بر «حضور» را مختل می‌کنند." },
                                            { t: "کنتراستِ سیاه و سفید:", d: "تضادِ شدید نوری که باعثِ تمرکزِ افراطی بر جداسازیِ بازه‌ها می‌شود." }
                                        ].map((item, i) => (
                                            <div key={i} className="flex gap-6"><div className="w-10 h-10 bg-rose-100 rounded-2xl flex items-center justify-center text-rose-600 font-bold shrink-0">{i+1}</div><div><h4 className="font-bold text-rose-900 text-xl">{item.t}</h4><p className="text-sm text-rose-800/70 mt-1">{item.d}</p></div></div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Section 4: Full Gallery Ref */}
                        <section id="gallery">
                            <h2 className="text-3xl font-bold text-[#283618] section-title flex items-center">
                                <i data-lucide="layout-grid" className="ml-3 text-[#bc6c25]"></i> مرجع بصری: ۶۱ داده‌یِ خام (GitHub Live)
                            </h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-5">
                                {SKETCH_DATA.map((s) => (
                                    <div key={s.id} className="sketch-card group cursor-help">
                                        <div className="aspect-square rounded-[1.5rem] mb-3 overflow-hidden bg-slate-100 relative shadow-inner border border-slate-50">
                                            <img 
                                                src={`${GITHUB_BASE}/${s.uni}/${encodeURIComponent(s.culture)}/${encodeURIComponent(s.file)}`} 
                                                alt={s.title} 
                                                className="w-full h-full object-cover grayscale opacity-60 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500"
                                                onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }}
                                            />
                                            <div className="hidden absolute inset-0 items-center justify-center text-[#283618]/20 flex-col p-2 text-center bg-slate-50">
                                                <i data-lucide="image-off" size={20} className="mb-1"></i>
                                                <span className="text-[6px] leading-tight font-bold">{s.file}</span>
                                            </div>
                                            <div className="absolute top-2 right-2 bg-white/70 px-1.5 rounded-lg text-[8px] font-bold">#{s.id}</div>
                                        </div>
                                        <h4 className="text-[9px] font-bold text-[#283618] truncate px-1">{s.title}</h4>
                                        <div className="flex justify-between items-center text-[7px] px-1 mt-1 opacity-50 font-bold uppercase tracking-tighter">
                                            <span className="truncate max-w-[50px]">{s.culture}</span>
                                            <span>{s.uni}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </div>

                    <footer className="mt-40 mb-20 text-center border-t border-[#283618]/10 pt-20 opacity-30">
                        <p className="text-[10px] font-bold tracking-[0.5em] text-[#bc6c25] uppercase">
                            Scientific Cynicism & Temporal Phenomenology - Industrial Design Research - 2024
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
