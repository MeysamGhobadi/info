<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری تصاویر فرهنگ و زمان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            padding: 10px;
        }
        .img-card {
            background-color: #111;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 300px;
        }
        .img-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #controls {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            text-align: center;
            z-index: 100;
            border-bottom: 1px solid #333;
        }
        input[type="file"] {
            display: none;
        }
        .btn-load {
            background-color: #fff;
            color: #000;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-family: 'Tahoma', sans-serif;
        }
    </style>
</head>
<body>

    <div id="controls">
        <label class="btn-load">
            انتخاب پوشه اصلی (AU/UT)
            <input type="file" id="folderInput" webkitdirectory directory multiple>
        </label>
    </div>

    <div id="gallery" class="gallery-grid">
        <!-- تصاویر اینجا لود می‌شوند -->
    </div>

    <script>
        const folderInput = document.getElementById('folderInput');
        const gallery = document.getElementById('gallery');

        // لیست فرهنگ‌های مورد نظر برای فیلتر
        const targetCultures = [
            'هندوستان',
            'غرب مدرن',
            'بومیان استرالیا',
            'ایران و اسلام',
            'آمریکای لاتین و عربی',
            'آفریقا',
            'آسیای شرقی',
            'اروپای شمالی'
        ];

        folderInput.addEventListener('change', (event) => {
            const files = event.target.files;
            gallery.innerHTML = ''; // پاک کردن گالری قبلی

            const validImages = [];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const path = file.webkitRelativePath;

                // بررسی فرمت تصویر
                const isImage = /\.(jpg|jpeg|png|gif|svg|webp|PNG|JPG)$/i.test(file.name);
                
                // بررسی اینکه آیا فایل در یکی از پوشه‌های فرهنگ مورد نظر هست یا خیر
                const isInCultureFolder = targetCultures.some(culture => path.includes(culture));
                
                // بررسی وجود AU یا UT در مسیر
                const isInUniFolder = path.includes('AU') || path.includes('UT');

                if (isImage && isInCultureFolder && isInUniFolder) {
                    validImages.push(file);
                }
            }

            // نمایش تصاویر
            validImages.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const card = document.createElement('div');
                    card.className = 'img-card';
                    
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.loading = 'lazy';
                    
                    card.appendChild(img);
                    gallery.appendChild(card);
                };
                reader.readAsDataURL(file);
            });

            if (validImages.length === 0) {
                const msg = document.createElement('p');
                msg.style.textAlign = 'center';
                msg.style.width = '100%';
                msg.textContent = 'هیچ تصویری با ساختار پوشه‌بندی مورد نظر پیدا نشد.';
                gallery.appendChild(msg);
            }
        });
    </script>
</body>
</html>
