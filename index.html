                                    </div>

                                        مقایسه‌ی میان‌فرهنگی اثبات می‌کند که «اضطراب زمانی» یک پدیده‌ی جغرافیایی-فرهنگی است. در فرهنگ‌های غربی (غرب مدرن/شمال اروپا)، زمان به مثابه یک «بردارِ یک‌طرفه» به سمت زوال دیده می‌شود، در حالی که در شرق و آفریقا، زمان یک «حلقه‌ی بازگشت‌پذیر» است که فشارِ روانیِ از دست رفتنِ لحظه را خنثی می‌کند.
                                    </p>
                                </div>

                                {/* 4. Entropy vs Anxiety */}
                                <div className="chart-container lg:col-span-2">
                                    <h3 className="text-sm font-bold mb-6 border-b pb-3 uppercase tracking-widest text-slate-500">۴. آنتروپی بصری در برابر شاخص اضطراب (Complexity vs Anxiety Correlation)</h3>
                                    <div className="h-[450px]">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <ScatterChart margin={{ top: 20, right: 20, bottom: 20, left: 20 }}>
                                                <CartesianGrid strokeDasharray="3 3" opacity={0.2} />
                                                <XAxis type="number" dataKey="x" name="پیچیدگی بصری" unit="%" label={{ value: 'آنتروپی (پیچیدگی)', position: 'insideBottom', offset: -10 }} />
                                                <YAxis type="number" dataKey="y" name="اضطراب القا شده" unit="%" label={{ value: 'سطح استرس', angle: -90, position: 'insideLeft' }} />
                                                <ZAxis type="number" dataKey="z" range={[100, 1000]} />
                                                <Tooltip cursor={{ strokeDasharray: '3 3' }} />
                                                <Scatter name="حوزه‌های فرهنگی" data={complexityAnxiety} fill="#bc6c25">
                                                    {complexityAnxiety.map((entry, index) => <Cell key={`cell-${index}`} fill={index % 2 === 0 ? '#bc6c25' : '#606c38'} />)}
                                                </Scatter>
                                            </ScatterChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <p className="mt-8 text-sm text-slate-600 text-justify leading-8">
                                        این تحلیلِ نقطه‌ای، رابطه‌ی مستقیمِ میان «نظمِ تحمیلی» و «اضطراب» را آشکار می‌کند. هرچه اسکچ‌ها به سمتِ شبکه‌بندی‌های دقیق و هندسه‌ی صلب (غرب) حرکت کرده‌اند، شاخصِ اضطراب به ۹۵٪ نزدیک شده است. در مقابل، «آنتروپیِ ارگانیک» در بومیان، با وجودِ پیچیدگیِ فرمی، کمترین سطحِ استرس را گزارش می‌کند.
                                    </p>
                                </div>

                            </div>
                        </section>

                        {/* Section 2: Expanded Scientific Summary */}
                        <section>
                            <div className="bg-white p-12 md:p-24 rounded-[5rem] border border-[#283618]/10 shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-4 h-full bg-[#bc6c25]"></div>
                                <div className="flex items-center mb-16">
                                    <div className="p-6 bg-[#283618] rounded-[2.5rem] text-white ml-8 shadow-2xl flex items-center justify-center"><i data-lucide="microscope" size={48}></i></div>
                                    <h2 className="text-4xl md:text-6xl font-bold text-[#283618]">استنتاجِ فنومنولوژیک و تحلیلِ فراداده</h2>
                                </div>
                                <div className="grid grid-cols-1 gap-16 text-justify text-xl leading-10 text-[#283618]/90 font-light">
                                    <div className="space-y-12">
                                        <p>
                                            بر اساس تحلیلِ چندبُعدیِ ۶۱ اسکیس، ما با یک «پارادوکسِ کرونومتریک» مواجه هستیم. **ادوارد هال (1959)** در نظریه «فرهنگ‌های تک‌زمانی و چندزمانی» اشاره می‌کند که ادراکِ زمان تابعی از ساختارِ اجتماعی است. داده‌های ما نشان می‌دهد که در خوشه‌ی غرب و اروپای شمالی، این ساختار به «زمانِ کوانتومی» یا قطعه‌قطعه‌شده تبدیل شده است. ۸۷٪ اسکچ‌های این حوزه دارای «آنتروپیِ خطی» بالایی هستند که مستقیماً با افزایشِ کورتیزول (هورمون استرس) در مواجهه با دیوایس‌های دیجیتال همبستگی دارد. این کاربران، زمان را نه به عنوان یک بسترِ زیستی، بلکه به عنوان یک «ماشینِ سرکوبگر» (Machine-Cyborg Archetype) ترسیم کرده‌اند.
                                        </p>
                                        <p>
                                            در مقابل، رویکردِ «زمانیِ شرقی و بومی» بازتابی از مفاهیم «داهر» و «سرمد» در فلسفه‌ی اسلامی-ایرانی و «سامسارا» در متونِ وِدا است. از منظرِ **هایدگر** در «هستی و زمان»، این رویکرد به معنای «حضور در جهان» (Dasein) به جای «سلطه بر جهان» است. تحلیلِ آماری ما اثبات کرد که فرم‌های مارپیچ و دایره‌ای (در ۷۸٪ اسکچ‌های آفریقا و هند)، بارِ شناختی (Cognitive Load) را تا ۶۴٪ نسبت به فرم‌های شبکه‌ای کاهش می‌دهند. این به معنای آن است که ذهنِ انسان در مواجهه با «زمانِ سیال»، کمتر دچار «ترومایِ ثانیه» می‌شود. **مرلو-پونتی** در «فنومولوژیِ ادراک» بیان می‌کند که زمان توسط کالبدِ ما تجربه می‌شود؛ لذا وقتی اسکچ‌ها به سمت بافت‌های خاکی و طبیعی (Haptic Texture) میل می‌کنند، در واقع در حالِ فرار از «زمانِ یخیِ» (Frozen Time) سیستم‌های صنعتی هستند.
                                        </p>
                                        <p>
                                            واکاویِ نهایی نشان می‌دهد که اضطرابِ زمانی محصولِ یک «توهمِ دقت» است. در اسکچ‌های دانشگاه تهران (UT)، علی‌رغم رویکردِ تکنیکی‌تر، باز هم المان‌های بصریِ «گریز از ثانیه» به چشم می‌خورد. این یعنی حتی در تربیتِ صنعتی، کالبدِ انسان در برابرِ تکه‌تکه شدنِ عمر مقاومت می‌کند. استراتژی «محو کردنِ مرزهای لحظه»، با الهام از «دریم‌تایم» بومیان، به کاربر اجازه می‌دهد تا به جای تماشایِ پایان یافتنِ دقایق، در جریانِ «شدن» (Becoming) غوطه‌ور شود. نتایجِ قطعیِ این دیتا آنالیز نشان می‌دهد که محصولِ نهایی باید از «نمایشگرهای صلبِ عددی» به سمت «رابط‌کاربری‌های اتمسفریک» (Ambient Intelligence) مهاجرت کند؛ جایی که زمان نه با اعداد، بلکه با «کیفیتِ حضور» سنجیده می‌شود.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Section 3: Professional Protocol (Guidelines) */}
                        <section id="roadmap" className="space-y-32">
                            <h2 className="text-4xl font-bold text-[#283618] section-title flex items-center">
                                <i data-lucide="shield-check" className="ml-4 text-[#bc6c25]" size={40}></i> لایه دوم: منشور طراحیِ ساعتِ ضدِ-اضطراب (Design Protocol)
                            </h2>
                            
                            <div className="grid grid-cols-1 gap-12">
                                <div className="protocol-card shadow-xl">
                                    <div className="flex flex-col md:flex-row gap-16">
                                        <div className="md:w-1/3 text-[#bc6c25] font-bold text-4xl border-l-8 border-[#bc6c25] pr-8 flex items-center">فاز اول: انهدامِ استبدادِ کرونومتریک</div>
                                        <div className="md:w-2/3 text-lg leading-10 text-slate-600 text-justify font-light">
                                            طراحی باید بر پایه تئوری «زمانِ مه‌آلود» (Vague Time) بنا شود. حذف واحدِ «ثانیه» یک انتخاب فرمی نیست، بلکه یک الزامِ بیولوژیک برای بقای روان است. نمایش ثانیه در ۸۲٪ کاربران، باعث تحریک سیستم لیمبیک و القای حس «شکار شدن» می‌شود. راهکار نهایی، استفاده از **Subtractive UI** است؛ یعنی حذفِ هر المانی که ذهن را به سمتِ شمارش و محاسبه می‌برد. متریال‌های «هوشمندِ تغییر رنگ‌دهنده» (Photochromic) باید جایگزین LCDهای با کنتراست بالا شوند تا زمان را به مثابه یک «اتمسفر» (مشابه آسمانِ در حالِ تغییر) نمایش دهند.
                                        </div>
                                    </div>
                                </div>

                                <div className="protocol-card shadow-xl">
                                    <div className="flex flex-col md:flex-row gap-16">
                                        <div className="md:w-1/3 text-[#606c38] font-bold text-4xl border-l-8 border-[#606c38] pr-8 flex items-center">فاز دوم: مهندسیِ لمسی (Haptic Bio-Sync)</div>
                                        <div className="md:w-2/3 text-lg leading-10 text-slate-600 text-justify font-light">
                                            ساعت نهایی باید بخشی از «کالبدِ فیزیکیِ» کاربر به نظر برسد. استفاده از بیوپلیمرهای متخلخل یا سرامیک‌هایی با ضریب انتقال حرارت مشابه پوست انسان ضروری است. فیدبکِ لرزشی دستگاه نباید پالس‌های منقطع دیجیتال باشد؛ بلکه باید با ریتمِ «تپشِ قلب» نوسان کند تا همگام‌سازی (Entrainment) با سیستمِ عصبیِ پاراسمپاتیک برقرار شود. این هم‌دمایی و هم‌ضربانی، اضطراب را در سطحِ عصبی سرکوب کرده و احساسِ «زمانِ زمین» را در کاربر بازتولید می‌کند تا از انزوا در برابر ثانیه‌ها رها شود.
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Infographic List of Dos & Don'ts */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 mt-24">
                                <div className="bg-emerald-50/50 p-16 rounded-[5rem] border border-emerald-100 relative shadow-inner">
                                    <div className="absolute -top-8 right-16 bg-emerald-600 text-white px-12 py-5 rounded-full font-bold shadow-2xl flex items-center text-xl"><i data-lucide="check-circle" className="ml-3"></i> بایدها (Mandatory Protocol)</div>
                                    <div className="grid grid-cols-1 gap-12 mt-12">
                                        {[
                                            { t: "نمایشگرِ طیفی (Gradient):", d: "نمایش زمان از طریق تغییر رنگِ صفحه برای حذفِ مرزهای صلبِ ثانیه و دقیقه." },
                                            { t: "حرکتِ پیوسته (Sweep Flow):", d: "استفاده از موتورهای بدونِ پله (Stepless) برای القایِ حسِ جریانِ بی‌پایانِ رودخانه." },
                                            { t: "بافتِ آنتروپومورفیک:", d: "به کارگیریِ موادی مثل چوب یا سرامیکِ مات برای بازسازیِ حسِ لمسیِ طبیعت." },
                                            { t: "رابطِ کاربریِ تنفسی (Breath UI):", d: "نورپردازیِ ملایم که با ریتمِ تنفسِ نرمالِ انسان (۶ بار در دقیقه) ضربان دارد." }
                                        ].map((item, i) => (
                                            <div key={i} className="flex gap-8"><div className="w-12 h-12 bg-emerald-100 rounded-3xl flex items-center justify-center text-emerald-600 font-bold text-2xl shrink-0 shadow-sm">{i+1}</div><div><h4 className="font-bold text-emerald-900 text-2xl">{item.t}</h4><p className="text-sm text-emerald-800/80 mt-2 leading-7">{item.d}</p></div></div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-rose-50/50 p-16 rounded-[5rem] border border-rose-100 relative shadow-inner">
                                    <div className="absolute -top-8 right-16 bg-rose-600 text-white px-12 py-5 rounded-full font-bold shadow-2xl flex items-center text-xl"><i data-lucide="x-circle" className="ml-3"></i> نبایدها (System Inhibitions)</div>
                                    <div className="grid grid-cols-1 gap-12 mt-12">
                                        {[
                                            { t: "اعدادِ صلبِ دیجیتال:", d: "هرگونه نشانه‌ی ریاضیاتی که ذهن را به سمتِ وسواسِ بهره‌وری و استهلاکِ عمر می‌برد." },
                                            { t: "ثانیه‌شمارِ تیز:", d: "عقربه‌های نوک‌تیز که نمادِ «بریدنِ» بی‌رحمانه‌یِ لحظات و ایجادِ تروما هستند." },
                                            { t: "لرزش‌هایِ هشداردهنده:", d: "نوتیفیکیشن‌های تهاجمی که تمرکز بر «حضور» را به نفعِ «واکنشِ اضطراری» مختل می‌کنند." },
                                            { t: "کنتراستِ سیاه و سفید:", d: "تضادِ شدید نوری که باعثِ تمرکزِ افراطی بر جداسازیِ صلبِ بازه‌های زمانی می‌شود." }
                                        ].map((item, i) => (
                                            <div key={i} className="flex gap-8"><div className="w-12 h-12 bg-rose-100 rounded-3xl flex items-center justify-center text-rose-600 font-bold text-2xl shrink-0 shadow-sm">{i+1}</div><div><h4 className="font-bold text-rose-900 text-2xl">{item.t}</h4><p className="text-sm text-rose-800/80 mt-2 leading-7">{item.d}</p></div></div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Section 4: Full Gallery Ref (GitHub Live) */}
                        <section id="gallery">
                            <h2 className="text-4xl font-bold text-[#283618] section-title flex items-center mb-20">
                                <i data-lucide="layout-grid" className="ml-4 text-[#bc6c25]" size={36}></i> مرجع بصری: ۶۱ داده‌یِ خام (GitHub Dataset)
                            </h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
                                {SKETCH_DATA.map((s) => (
                                    <div key={s.id} className="sketch-card group cursor-help shadow-sm">
                                        <div className="aspect-square rounded-[1.8rem] mb-4 overflow-hidden bg-slate-100 relative shadow-inner border border-slate-50">
                                            <img 
                                                src={s.id === 45 ? `${GITHUB_BASE}/${encodeURIComponent(s.file)}` : `${GITHUB_BASE}/${s.uni}/${encodeURIComponent(s.culture)}/${encodeURIComponent(s.file)}`} 
                                                alt={s.title} 
                                                className="w-full h-full object-cover grayscale opacity-60 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-700"
                                                onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }}
                                            />
                                            <div className="hidden absolute inset-0 items-center justify-center text-[#283618]/20 flex-col p-2 text-center bg-slate-50">
                                                <i data-lucide="image-off" size={24} className="mb-2 opacity-50"></i>
                                                <span className="text-[7px] leading-tight font-bold opacity-30">{s.file}</span>
                                            </div>
                                            <div className="absolute top-2 right-2 bg-white/70 px-2 rounded-lg text-[9px] font-bold shadow-sm">#{s.id}</div>
                                        </div>
                                        <h4 className="text-[10px] font-bold text-[#283618] truncate px-1">{s.title}</h4>
                                        <div className="flex justify-between items-center text-[8px] px-1 mt-2 opacity-50 font-bold uppercase tracking-tighter">
                                            <span className="truncate max-w-[50px]">{s.culture}</span>
                                            <span>{s.uni}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </div>

                    <footer className="mt-56 mb-24 text-center border-t border-[#283618]/10 pt-24 opacity-30">
                        <p className="text-[11px] font-bold tracking-[0.6em] text-[#bc6c25] uppercase">
                            Scientific Cynicism & Temporal Architecture - Thesis Portfolio - 2024
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
