<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کالبد شکافی تجربه ی فرهنگ های مختلف از زمان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            scroll-behavior: smooth;
            background-color: #020617;
            color: #F1F5F9;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            padding: 20px;
        }
        .img-card {
            background-color: #0f172a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .img-card:hover {
            transform: translateY(-4px);
            border-color: #6366f1;
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.3);
        }
        .img-container {
            width: 100%;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            position: relative;
        }
        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .info-panel {
            padding: 12px;
            font-size: 11px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
        }
        .badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #1e293b;
            color: #94a3b8;
            margin-bottom: 4px;
            display: inline-block;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="antialiased">

    <header class="p-8 border-b border-slate-800 text-center bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <h1 class="text-3xl md:text-4xl font-black text-white mb-2">کالبد شکافی تجربه ی فرهنگ های مختلف از زمان</h1>
        <p class="text-slate-500 text-sm">نمایش ۶۱ اسکچ استخراج شده | مسیر مستقیم AU و UT</p>
    </header>

    <main class="container mx-auto py-10">
        <div id="gallery" class="gallery-grid">
            <!-- تصاویر به صورت خودکار لود می‌شوند -->
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const gallery = document.getElementById('gallery');

            // لیست فرهنگ‌ها مطابق با ساختار پوشه‌بندی شما
            const cultures = [
                'هندوستان',
                'غرب مدرن',
                'بومیان استرالیا',
                'ایران و اسلام',
                'آمریکای لاتین و عربی',
                'آفریقا',
                'آسیای شرقی',
                'اروپای شمالی'
            ];

            // بازسازی لیست ۶۱ موردی با مسیرهای نسبی مستقیم
            const sketches = [
                // هندوستان
                { uni: 'UT', cat: 'هندوستان', file: 'پسر-طراحی صنعتی-تهران.jpg' },
                { uni: 'UT', cat: 'هندوستان', file: 'دختر-طراحی صنعتی-تهران.jpg' },
                { uni: 'AU', cat: 'هندوستان', file: 'هنر-پسر-طراحی صنعتی.jpg' },
                { uni: 'AU', cat: 'هندوستان', file: 'هنر-دختر-طراحی صنعتی.jpg' },
                { uni: 'UT', cat: 'هندوستان', file: 'India_Sketch_01.jpg' },
                { uni: 'AU', cat: 'هندوستان', file: 'India_Sketch_02.jpg' },

                // غرب مدرن
                { uni: 'UT', cat: 'غرب مدرن', file: 'پسر-ادبیات نمایشی-تهران02.jpg' },
                { uni: 'UT', cat: 'غرب مدرن', file: 'دختر طراحی صنعتی-تهران03.jpg' },
                { uni: 'UT', cat: 'غرب مدرن', file: 'پسر-نمایش-تهران02.jpg' },
                { uni: 'UT', cat: 'غرب مدرن', file: 'پسر-طراحی صنعتی-تهران 04.jpg' },
                { uni: 'UT', cat: 'غرب مدرن', file: 'دختر-طراحی صنعتی-تهران02.jpg' },
                { uni: 'AU', cat: 'غرب مدرن', file: 'هنر-پسر-معماری.jpeg' },
                { uni: 'AU', cat: 'غرب مدرن', file: 'هنر-پسر-مجسمه.jpg' },
                { uni: 'AU', cat: 'غرب مدرن', file: 'هنر-دختر-مجسمه.jpeg' },

                // آسیای شرقی
                { uni: 'UT', cat: 'آسیای شرقی', file: 'دختر-نقاشی-تهران02.jpg' },
                { uni: 'UT', cat: 'آسیای شرقی', file: 'دختر-طراحی صنعتی-تهران08.jpeg' },
                { uni: 'UT', cat: 'آسیای شرقی', file: 'پسر-مجسمه-تهران01.jpg' },
                { uni: 'UT', cat: 'آسیای شرقی', file: 'دختر-طراحی صحنه-تهران01.jpeg' },
                { uni: 'UT', cat: 'آسیای شرقی', file: 'پسر-موسیقی-تهران01.jpeg' },
                { uni: 'AU', cat: 'آسیای شرقی', file: 'هنر-پسر-معماری داخلی.jpeg' },
                { uni: 'AU', cat: 'آسیای شرقی', file: 'هنر-دختر-معماری.jpeg' },
                { uni: 'AU', cat: 'آسیای شرقی', file: 'هنر-پسر-نقاشی.jpg' },

                // آفریقا
                { uni: 'UT', cat: 'آفریقا', file: 'پسر-طراحی صنعتی-تهران01.jpg' },
                { uni: 'UT', cat: 'آفریقا', file: 'پسر-طراحی صنعتی-تهران02.jpeg' },
                { uni: 'UT', cat: 'آفریقا', file: 'پسر-نقاشی-تهران01-1.jpg' },
                { uni: 'UT', cat: 'آفریقا', file: 'پسر-نقاشی-تهران01-2.jpg' },
                { uni: 'UT', cat: 'آفریقا', file: 'دختر-گرافیک-تهران01.jpg' },
                { uni: 'UT', cat: 'آفریقا', file: 'دختر-طراحی صنعتی-تهران-04.jpg' },
                { uni: 'UT', cat: 'آفریقا', file: 'دختر-مجسمه-تهران03.jpg' },
                { uni: 'AU', cat: 'آفریقا', file: 'هنر-پسر-مجسمه.jpeg' },
                { uni: 'AU', cat: 'آفریقا', file: 'هنر-پسر-معماری.jpeg' },
                { uni: 'AU', cat: 'آفریقا', file: 'هنر-پسر-معماری01.jpeg' },

                // ایران و اسلام
                { uni: 'UT', cat: 'ایران و اسلام', file: 'دختر-طراحی صنعتی-تهران 05.jpg' },
                { uni: 'UT', cat: 'ایران و اسلام', file: 'پسر-معماری-تهران01.jpg' },
                { uni: 'UT', cat: 'ایران و اسلام', file: 'پسر-گرافیک-تهران02.jpg' },
                { uni: 'UT', cat: 'ایران و اسلام', file: 'پسر-طراحی صحنه-تهران01.jpg' },
                { uni: 'AU', cat: 'ایران و اسلام', file: 'هنر-دختر-نقاشی.jpeg' },
                { uni: 'AU', cat: 'ایران و اسلام', file: 'هنر-دختر-مجسمه.jpeg' },
                { uni: 'AU', cat: 'ایران و اسلام', file: 'هنر-پسر-نقاشی.jpeg' },

                // آمریکای لاتین و عربی
                { uni: 'UT', cat: 'آمریکای لاتین و عربی', file: 'پسر-کارگردانی-تهران01.jpg' },
                { uni: 'UT', cat: 'آمریکای لاتین و عربی', file: 'دختر-مجسمه-تهران01.jpeg' },
                { uni: 'UT', cat: 'آمریکای لاتین و عربی', file: 'دختر-نقاشی-تهران03.jpg' },
                { uni: 'UT', cat: 'آمریکای لاتین و عربی', file: 'دختر-طراحی صنعتی-تهران06.jpg' },
                { uni: 'AU', cat: 'آمریکای لاتین و عربی', file: 'هنر-دختر-معماری01.jpg' },
                { uni: 'AU', cat: 'آمریکای لاتین و عربی', file: 'هنر-پسر-مجسمه.jpeg' },
                { uni: 'AU', cat: 'آمریکای لاتین و عربی', file: 'هنر-دختر-معماری.jpeg' },

                // اروپای شمالی
                { uni: 'UT', cat: 'اروپای شمالی', file: 'دختر-نقاشی-تهران01.jpg' },
                { uni: 'UT', cat: 'اروپای شمالی', file: 'پسر-طراحی صنعتی-تهران 05.jpg' },
                { uni: 'UT', cat: 'اروپای شمالی', file: 'دختر-طراحی صنعتی-تهران01.jpg' },
                { uni: 'UT', cat: 'اروپای شمالی', file: 'دختر-طراحی صنعتی-تهران07.jpeg' },
                { uni: 'AU', cat: 'اروپای شمالی', file: 'هنر-دختر-نقاشی.jpeg' },
                { uni: 'AU', cat: 'اروپای شمالی', file: 'هنر-پسر-مجسمه.jpeg' },
                { uni: 'AU', cat: 'اروپای شمالی', file: 'هنر-دختر-معماری.jpeg' },

                // بومیان استرالیا
                { uni: 'UT', cat: 'بومیان استرالیا', file: 'پسر-گرافیک-تهران01.jpg' },
                { uni: 'UT', cat: 'بومیان استرالیا', file: 'پسر-طراحی صنعتی-تهران03.jpg' },
                { uni: 'UT', cat: 'بومیان استرالیا', file: 'دختر-طراحی صحنه-تهران02.jpg' },
                { uni: 'UT', cat: 'بومیان استرالیا', file: 'دختر-مجسمه-تهران02.jpg' },
                { uni: 'UT', cat: 'بومیان استرالیا', file: 'پسر-نمایش-تهران01.jpg' },
                { uni: 'AU', cat: 'بومیان استرالیا', file: 'هنر-دختر-مجسمه سازی.jpg' },
                { uni: 'AU', cat: 'بومیان استرالیا', file: 'هنر-دختر-معماری.jpeg' },
                { uni: 'AU', cat: 'بومیان استرالیا', file: 'هنر-پسر-معماری.jpeg' }
            ];

            sketches.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'img-card';
                
                // مسیر مستقیم: فایل index.html کنار AU و UT است
                const path = `./${item.uni}/${item.cat}/${item.file}`;
                const baseName = item.file.split('.')[0];
                
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${path}" 
                             alt="${item.file}" 
                             loading="lazy"
                             onerror="handleError(this, '${item.uni}', '${item.cat}', '${baseName}')">
                    </div>
                    <div class="info-panel">
                        <div class="badge">${item.uni} | ${item.cat}</div>
                        <div class="truncate text-slate-400 font-medium" title="${item.file}">${item.file}</div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        });

        // تابع برای تست کردن فرمت‌های مختلف در صورت بروز خطا در مسیر اولیه
        function handleError(img, uni, cat, base) {
            const extensions = ['jpg', 'jpeg', 'png', 'PNG', 'JPG', 'svg', 'webp'];
            if (!img.dataset.extIdx) img.dataset.extIdx = 0;
            let idx = parseInt(img.dataset.extIdx);
            
            if (idx < extensions.length) {
                img.dataset.extIdx = idx + 1;
                img.src = `./${uni}/${cat}/${base}.${extensions[idx]}`;
            } else {
                img.src = 'https://placehold.co/400x300/020617/1e293b?text=Not+Found';
                img.onerror = null;
            }
        }
    </script>
</body>
</html>
