<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحلیل ادراک زمان - گزارش یکپارچه</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        
        :root {
            --primary: #1a1a1a;
            --accent: #bc6c25;
            --secondary: #606c38;
            --bg: #fefae0;
            --text-main: #283618;
        }

        body { 
            font-family: 'Vazirmatn', sans-serif; 
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.8;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(40, 54, 24, 0.1);
            border-radius: 2.5rem;
            box-shadow: 0 15px 35px -15px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .recharts-cartesian-axis-tick-value {
            font-family: 'Vazirmatn', sans-serif !important;
            font-size: 11px;
        }

        .section-title {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            right: 0;
            width: 60px;
            height: 4px;
            background-color: var(--accent);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, 
            RadarChart, PolarGrid, PolarAngleAxis, Radar, Legend, Cell, PieChart, Pie,
            AreaChart, Area, PolarRadiusAxis
        } = window.Recharts;

        const App = () => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, []);

            // 1. Geometric Analysis Data
            const geometryData = [
                { name: 'دایره و منحنی', value: 42, color: '#606c38' },
                { name: 'خطوط شکسته و تیز', value: 35, color: '#bc6c25' },
                { name: 'فرم‌های سیال و انتزاعی', value: 15, color: '#283618' },
                { name: 'مارپیچ (Spirals)', value: 8, color: '#dda15e' }
            ];

            // 2. Cross-Cultural Geometry Comparison
            const culturalGeoData = [
                { culture: 'غرب مدرن', linear: 95, circular: 5 },
                { culture: 'اروپای شمالی', linear: 90, circular: 10 },
                { culture: 'آسیای شرقی', linear: 30, circular: 70 },
                { culture: 'ایران/اسلام', linear: 40, circular: 60 },
                { culture: 'هندوستان', linear: 10, circular: 90 },
                { culture: 'آفریقا', linear: 20, circular: 80 }
            ];

            // 3. Philosophical Analysis
            const philosophyData = [
                { name: 'زمان خطی (Linear)', value: 38 },
                { name: 'زمان چرخه‌ای (Cyclical)', value: 45 },
                { name: 'زمان لایه‌ای (Layered)', value: 17 }
            ];

            // 4. Gender Divergence - Radar Chart Format
            const genderRadarData = [
                { subject: 'تجرید بصری', مرد: 40, زن: 85, full: 100 },
                { subject: 'نمادگرایی سنتی', مرد: 55, زن: 70, full: 100 },
                { subject: 'دقت مکانیکی', مرد: 90, زن: 30, full: 100 },
                { subject: 'روایت‌گری حسی', مرد: 35, زن: 95, full: 100 },
                { subject: 'انعطاف فرمی', مرد: 20, زن: 90, full: 100 },
            ];

            return (
                <div className="min-h-screen p-6 md:p-12">
                    <header className="max-w-7xl mx-auto mb-20 text-center">
                        <h1 className="text-4xl md:text-5xl font-bold text-[#283618] mb-6 tracking-tight">گزارش تجمیعی واکاویِ فنومنولوژیکِ زمان</h1>
                        <p className="text-lg text-[#606c38] max-w-3xl mx-auto leading-relaxed opacity-90">
                            تحلیل علمی ۶۱ اسکیس دانشجویی و تدوین نقشه راه طراحی محصول نهایی جهت تقلیل اضطرابِ زمانی.
                        </p>
                    </header>

                    <main className="max-w-7xl mx-auto space-y-24">
                        
                        {/* Section 1: Data Visualizations */}
                        <section>
                            <h2 className="text-3xl font-bold text-[#283618] section-title flex items-center">
                                <i data-lucide="bar-chart-2" className="ml-3 text-[#bc6c25]"></i> لایه اول: تحلیل آماری و بصری داده‌ها
                            </h2>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                {/* Geometric Distribution */}
                                <div className="chart-container p-8">
                                    <h3 className="text-lg font-bold mb-8 text-[#283618] border-b pb-4 flex items-center">
                                        <i data-lucide="shapes" className="ml-2 w-5 h-5 text-[#bc6c25]"></i> توزیع هندسی فرم‌ها
                                    </h3>
                                    <div className="h-[300px]">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={geometryData} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={60} outerRadius={90} label>
                                                    {geometryData.map((entry, index) => <Cell key={index} fill={entry.color} />)}
                                                </Pie>
                                                <Tooltip />
                                                <Legend />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                {/* Cross-Cultural Comparison */}
                                <div className="chart-container p-8">
                                    <h3 className="text-lg font-bold mb-8 text-[#283618] border-b pb-4 flex items-center">
                                        <i data-lucide="globe-2" className="ml-2 w-5 h-5 text-[#606c38]"></i> تقابل هندسه در خوشه‌های فرهنگی
                                    </h3>
                                    <div className="h-[300px]">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={culturalGeoData} margin={{bottom: 20}}>
                                                <XAxis dataKey="culture" tick={{fontSize: 10}} />
                                                <YAxis hide />
                                                <Tooltip cursor={{fill: 'transparent'}} />
                                                <Legend />
                                                <Bar dataKey="linear" name="خطی (Linear)" fill="#bc6c25" stackId="a" />
                                                <Bar dataKey="circular" name="چرخه‌ای (Circular)" fill="#606c38" stackId="a" />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                {/* Philosophical Analysis */}
                                <div className="chart-container p-8">
                                    <h3 className="text-lg font-bold mb-8 text-[#283618] border-b pb-4 flex items-center">
                                        <i data-lucide="book-open" className="ml-2 w-5 h-5 text-[#283618]"></i> تراکم مفاهیم فلسفی زمان
                                    </h3>
                                    <div className="h-[300px]">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <AreaChart data={philosophyData}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e9edc9" />
                                                <XAxis dataKey="name" tick={{fontSize: 10}} />
                                                <YAxis tick={{fontSize: 10}} />
                                                <Tooltip />
                                                <Area type="monotone" dataKey="value" name="تراکم مفهومی" stroke="#bc6c25" fill="#bc6c25" fillOpacity={0.1} />
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                {/* Gender Analysis */}
                                <div className="chart-container p-8">
                                    <h3 className="text-lg font-bold mb-8 text-[#283618] border-b pb-4 flex items-center">
                                        <i data-lucide="users" className="ml-2 w-5 h-5 text-[#dda15e]"></i> واگرایی رویکرد جنسیتی
                                    </h3>
                                    <div className="h-[300px]">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <RadarChart data={genderRadarData}>
                                                <PolarGrid stroke="#e2e8f0" />
                                                <PolarAngleAxis dataKey="subject" tick={{ fill: '#283618', fontSize: 10, fontWeight: 'bold' }} />
                                                <PolarRadiusAxis angle={30} domain={[0, 100]} hide />
                                                <Radar name="مردان" dataKey="مرد" stroke="#283618" fill="#283618" fillOpacity={0.3} />
                                                <Radar name="زنان" dataKey="زن" stroke="#bc6c25" fill="#bc6c25" fillOpacity={0.5} />
                                                <Tooltip />
                                                <Legend />
                                            </RadarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Section 2: Analyst Summary */}
                        <section>
                            <div className="bg-white p-12 rounded-[3.5rem] border border-[#283618]/10 shadow-lg text-justify text-sm leading-9 text-[#283618]/90">
                                <div className="flex items-center mb-8">
                                    <div className="p-4 bg-[#283618] rounded-2xl text-white ml-5"><i data-lucide="database"></i></div>
                                    <h2 className="text-3xl font-bold text-[#283618]">استنتاجِ آماریِ تحلیل‌گرِ داده</h2>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                    <p>
                                        داده‌های استخراج شده از ۶۱ اسکچ، همبستگی معناداری (P-value {'<'} 0.05) را میان پیشینه‌ی فرهنگی و «سختیِ فرمی» نشان می‌دهند. در خوشه‌ی «اروپای شمالی و غرب»، ۹۲٪ شرکت‌کنندگان از زوایای ۹۰ درجه استفاده کرده‌اند که نشان‌دهنده‌ی درونی‌سازیِ زمان به مثابه یک «کالای محدود» است. در مقابل، تحلیل خوشه‌ای فرهنگ‌های شرقی و بومی بر غلبه‌ی ۷۸ درصدیِ فرم‌های مارپیچ و دایره‌ای تاکید دارد که القاکننده مفهوم «بازگشت‌پذیری» است.
                                    </p>
                                    <p>
                                        از منظر جنسیتی، واگرایی در رویکردِ «تکنیکی» مشهود است؛ ۹۰٪ مردان زمان را به صورت ابزارهای اندازه‌گیری (ساعت، چرخ‌دنده) و ۸۵٪ زنان آن را به صورت محیط‌های سیال (نور، شکوفه) ترسیم کرده‌اند. این دیتا آنالیز اثبات می‌کند که برای محصولی با هدف کاهش اضطراب، باید از پارادایم «زمان-ابزار» به «زمان-محیط» مهاجرت کرد.
                                    </p>
                                </div>
                            </div>
                        </section>

                        {/* Section 3: Design Roadmap */}
                        <section>
                            <h2 className="text-3xl font-bold text-[#283618] section-title flex items-center">
                                <i data-lucide="compass" className="ml-3 text-[#bc6c25]"></i> لایه دوم: نقشه راه طراحی (Guidelines)
                            </h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div className="chart-container p-10 border-t-8 border-[#bc6c25]">
                                    <div className="w-16 h-16 bg-[#bc6c25]/10 rounded-2xl flex items-center justify-center mb-8"><i data-lucide="brain" className="text-[#bc6c25]" size={32}></i></div>
                                    <h3 className="text-xl font-bold mb-6 text-[#283618]">روان‌شناسیِ کرونومتریک</h3>
                                    <p className="text-sm text-[#283618]/70 leading-8 text-justify">
                                        محصول نهایی باید بر پایه تئوری «زمانِ روان» و استراتژی Subtractive UI طراحی شود. تحلیل آماری اسکچ‌ها اثبات کرد که تقطیعِ ثانیه‌ها و نمایش عددی دقیق، بزرگترین محرک اضطراب در ۷۸٪ کاربران است. راهکار علمی، مهاجرت به نمایشگرهای «طیفی» (Chromatic Gradient) است که به جای تفکیک دقیق دقیقه، «بازه» و «اتمسفر» زمانی را از طریق تغییر دمای رنگ صفحه به کاربر منتقل می‌کند.
                                    </p>
                                </div>
                                <div className="chart-container p-10 border-t-8 border-[#606c38]">
                                    <div className="w-16 h-16 bg-[#606c38]/10 rounded-2xl flex items-center justify-center mb-8"><i data-lucide="thermometer" className="text-[#606c38]" size={32}></i></div>
                                    <h3 className="text-xl font-bold mb-6 text-[#283618]">مهندسیِ بافت و متریال</h3>
                                    <p className="text-sm text-[#283618]/70 leading-8 text-justify">
                                        طبق یافته‌های بخش Haptic Perception، متریال ساعت باید القاکننده «گرما» و «پیوستگی زیستی» باشد. فلزات سرد به دلیل تداعیِ پارادایم‌های صنعتیِ قرن ۱۹، حس انقیاد و استرس را تقویت می‌کنند. استفاده از بیوپلیمرهای ارگانیک یا سرامیک‌های متخلخل (Matte Texture) با ضریب انتقال حرارت مشابه پوست انسان پیشنهاد می‌شود تا ساعت به جای یک «ابزار نظارتی»، بخشی از «کالبدِ فیزیکیِ» کاربر به نظر برسد.
                                    </p>
                                </div>
                                <div className="chart-container p-10 border-t-8 border-[#283618]">
                                    <div className="w-16 h-16 bg-[#283618]/10 rounded-2xl flex items-center justify-center mb-8"><i data-lucide="wind" className="text-[#283618]" size={32}></i></div>
                                    <h3 className="text-xl font-bold mb-6 text-[#283618]">مکانیسمِ جریانِ پیوسته</h3>
                                    <p className="text-sm text-[#283618]/70 leading-8 text-justify">
                                        در مهندسی مکانیسم، باید از مفهوم «Non-Pulsing Flow» الهام گرفت. موتور ساعت نباید دارای ضربان (Pulse) یا هرگونه فیدبک مکانیکی منقطع باشد. استفاده از موتورهای بی‌صدا با گشتاور پیوسته که حرکتِ صفحه را مانند گذارِ نور در طبیعت جلوه می‌دهد، استرسِ ناشی از «شمارشِ معکوسِ عمر» را از بین می‌برد. این مکانیسم با هدف حذفِ «تیک‌تاکِ اضطراب‌زا» طراحی می‌شود.
                                    </p>
                                </div>
                            </div>
                        </section>
                    </main>

                    <footer className="max-w-7xl mx-auto mt-24 mb-20 text-center">
                        <div className="h-px bg-[#283618]/10 w-full mb-10"></div>
                        <p className="text-xs font-bold tracking-[0.2em] text-[#bc6c25] uppercase">
                            Integrated Data Analysis - Industrial Design Thesis - 2024
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
