                                                className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700"
                                                onError={(e) => { 
                                                    e.target.style.display = 'none'; 
                                                    e.target.nextSibling.style.display = 'flex'; 
                                                }}
                                            />
                                            <div className="hidden absolute inset-0 items-center justify-center text-[#283618]/30 flex-col p-4 text-center">
                                                <i data-lucide="image-off" size={24} className="mb-2"></i>
                                                <span className="text-[8px] leading-tight font-bold">یافت نشد<br/>({s.file})</span>
                                            </div>
                                            <div className="absolute top-2 right-2 bg-white/90 backdrop-blur-sm px-2 py-1 rounded-lg text-[9px] font-bold shadow-sm">
                                                #{s.id}
                                            </div>
                                        </div>
                                        <h4 className="text-[10px] font-bold text-[#283618] mb-1 truncate px-1" title={s.title}>{s.title}</h4>
                                        <div className="flex justify-between items-center text-[8px] border-t border-slate-50 pt-2 mt-2 px-1">
                                            <span className="text-[#bc6c25] font-bold truncate max-w-[80px]">{s.culture}</span>
                                            <span className={`px-1.5 py-0.5 rounded text-white font-bold ${s.uni === 'UT' ? 'bg-[#283618]' : 'bg-[#606c38]'}`}>{s.uni}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Section 4: Design Guidelines */}
                        <section className="pb-20">
                            <h2 className="text-3xl font-bold text-[#283618] section-title flex items-center">
                                <i data-lucide="compass" className="ml-3 text-[#bc6c25]"></i> لایه دوم: اصول طراحی محصول نهایی
                            </h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div className="chart-container p-10 border-t-8 border-[#bc6c25]">
                                    <div className="w-16 h-16 bg-[#bc6c25]/10 rounded-2xl flex items-center justify-center mb-8"><i data-lucide="brain" className="text-[#bc6c25]" size={32}></i></div>
                                    <h3 className="text-xl font-bold mb-6">روان‌شناسیِ کرونومتریک</h3>
                                    <p className="text-sm text-[#283618]/70 leading-8 text-justify">استفاده از نمایشگرهای «طیفی» (Chromatic Gradient) که به جای تفکیک دقیق دقیقه، «بازه» و «اتمسفر» زمانی را از طریق تغییر دمای رنگ صفحه به کاربر منتقل می‌کند.</p>
                                </div>
                                <div className="chart-container p-10 border-t-8 border-[#606c38]">
                                    <div className="w-16 h-16 bg-[#606c38]/10 rounded-2xl flex items-center justify-center mb-8"><i data-lucide="thermometer" className="text-[#606c38]" size={32}></i></div>
                                    <h3 className="text-xl font-bold mb-6">مهندسیِ بافت و متریال</h3>
                                    <p className="text-sm text-[#283618]/70 leading-8 text-justify">استفاده از بیوپلیمرهای ارگانیک یا سرامیک‌های متخلخل با ضریب انتقال حرارت مشابه پوست انسان پیشنهاد می‌شود تا ساعت بخشی از «کالبدِ فیزیکیِ» کاربر به نظر برسد.</p>
                                </div>
                                <div className="chart-container p-10 border-t-8 border-[#283618]">
                                    <div className="w-16 h-16 bg-[#283618]/10 rounded-2xl flex items-center justify-center mb-8"><i data-lucide="wind" className="text-[#283618]" size={32}></i></div>
                                    <h3 className="text-xl font-bold mb-6">مکانیسمِ جریانِ پیوسته</h3>
                                    <p className="text-sm text-[#283618]/70 leading-8 text-justify">استفاده از موتورهای بی‌صدا با گشتاور پیوسته که حرکتِ صفحه را مانند گذارِ نور در طبیعت جلوه می‌دهد، استرسِ ناشی از «شمارشِ معکوسِ عمر» را از بین می‌برد.</p>
                                </div>
                            </div>
                        </section>
                    </div>

                    <footer className="mt-20 mb-20 text-center border-t border-[#283618]/10 pt-10 opacity-30">
                        <p className="text-xs font-bold tracking-[0.3em] text-[#bc6c25] uppercase">Integrated Design Thesis Analysis - 2024</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
